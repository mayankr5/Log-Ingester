<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Explorer</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./index.js" defer></script>
</head>
<body>
    <header class="topbar">
        <h1>Log Explorer</h1>
        <span class="health" id="health" title="API health">checking…</span>
    </header>

    <main>
        <form id="query-form" class="search">
            <div class="search-row">
                <input id="query" type="text" autocomplete="off" spellcheck="false"
                       placeholder='Search logs, e.g. level:error AND resourceId:server-1*'>
                <select id="range" aria-label="Time range">
                    <option value="15m">Last 15 minutes</option>
                    <option value="1h">Last 1 hour</option>
                    <option value="24h" selected>Last 24 hours</option>
                    <option value="7d">Last 7 days</option>
                    <option value="all">All time</option>
                    <option value="custom">Custom…</option>
                </select>
                <button type="submit" class="primary">Search</button>
            </div>

            <div class="custom-range" id="custom-range" hidden>
                <label>From <input type="datetime-local" id="from"></label>
                <label>To <input type="datetime-local" id="to"></label>
            </div>

            <div class="examples">
                <span>Try:</span>
                <button type="button" class="chip" data-q="level:error">level:error</button>
                <button type="button" class="chip" data-q="level:error OR level:warn">level:error OR level:warn</button>
                <button type="button" class="chip" data-q="NOT level:info">NOT level:info</button>
                <button type="button" class="chip" data-q='"connection refused"'>"connection refused"</button>
                <button type="button" class="chip" data-q="resourceId:server-1*">resourceId:server-1*</button>
            </div>
        </form>

        <div class="error" id="error" hidden></div>

        <section class="results">
            <div class="results-header">
                <span id="status">Run a search to see logs.</span>
            </div>
            <table id="log-table">
                <thead>
                    <tr>
                        <th class="col-time">Time</th>
                        <th class="col-level">Level</th>
                        <th class="col-resource">Resource</th>
                        <th>Message</th>
                    </tr>
                </thead>
                <tbody id="log-body"></tbody>
            </table>
            <div class="empty" id="empty" hidden>No logs match this search.</div>
            <button id="load-more" type="button" class="secondary" hidden>Load more</button>
        </section>
    </main>

    <aside class="details" id="details" hidden>
        <div class="details-header">
            <h2>Log details</h2>
            <button type="button" class="icon" id="close-details" aria-label="Close">✕</button>
        </div>
        <p class="hint">Click a highlighted value to add it to your search.</p>
        <dl id="details-fields"></dl>
        <pre id="details-json"></pre>
    </aside>
</body>
</html>
